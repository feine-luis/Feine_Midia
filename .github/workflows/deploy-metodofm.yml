name: Build and publish metodofm landing

on:
  push:
    branches: [main]
    paths:
      - 'site-metodofm/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-metodofm
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: site-metodofm/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: site-metodofm
        run: pnpm install --no-frozen-lockfile

      - name: Build (production)
        working-directory: site-metodofm
        run: pnpm build:prod

      - name: Add SPA fallback (404.html)
        working-directory: site-metodofm
        run: cp dist/index.html dist/404.html

      - name: Sync build output into /metodofm
        run: |
          mkdir -p metodofm
          rsync -a --delete site-metodofm/dist/ metodofm/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metodofm
          git diff --cached --quiet || git commit -m "chore: deploy metodofm landing [skip ci]"
          git push
